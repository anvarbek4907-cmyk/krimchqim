openapi: 3.0.3
info:
  title: Kirim-Chiqim nazorati API
  version: 1.0.0
  description: |-
    Shaxsiy moliya (kirim va chiqimlar) nazorati uchun REST API.

    **Autentifikatsiya:** `/api/auth/login/` orqali access va refresh token oling va `Authorization: Bearer <access>` headeri bilan yuboring. Access muddati tugasa `/api/auth/refresh/` orqali yangilang. Swagger'da **Authorize** tugmasiga faqat access tokenni kiriting.
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      summary: Parolni almashtirish
      tags:
      - Autentifikatsiya
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Kirish (token olish)
      tags:
      - Autentifikatsiya
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Chiqish (refresh tokenni bekor qilish)
      tags:
      - Autentifikatsiya
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Mening profilim
      tags:
      - Autentifikatsiya
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    put:
      operationId: auth_me_update
      summary: Profilni to'liq yangilash
      tags:
      - Autentifikatsiya
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Profilni qisman yangilash
      tags:
      - Autentifikatsiya
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Refresh token orqali yangi access (va yangi refresh) oladi. Eski
        refresh bekor qilinadi.
      summary: Access tokenni yangilash
      tags:
      - Autentifikatsiya
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      summary: Ro'yxatdan o'tish
      tags:
      - Autentifikatsiya
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      summary: Kategoriyalar ro'yxati
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - expense
          - income
        description: Tur bo'yicha filtr
      tags:
      - Kategoriyalar
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      summary: Kategoriya yaratish
      tags:
      - Kategoriyalar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      summary: Kategoriyani ko'rish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Kategoriyalar
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      summary: Kategoriyani to'liq yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Kategoriyalar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      summary: Kategoriyani qisman yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Kategoriyalar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: Tranzaksiyasi bor kategoriyani o'chirib bo'lmaydi (400).
      summary: Kategoriyani o'chirish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Kategoriyalar
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/summary/:
    get:
      operationId: summary_retrieve
      summary: Jami kirim, chiqim va kategoriyalar kesimi
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: wallet
        schema:
          type: integer
      tags:
      - Statistika
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
          description: ''
  /api/transactions/:
    get:
      operationId: transactions_list
      summary: Kirim-chiqimlar ro'yxati (filtr, qidiruv, tartiblash)
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: max_amount
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      - in: query
        name: min_amount
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      - in: query
        name: ordering
        schema:
          enum:
          - date
          - -date
          - amount
          - -amount
          - created_at
          - -created_at
          type: string
          minLength: 1
        description: |-
          * `date` - date
          * `-date` - -date
          * `amount` - amount
          * `-amount` - -amount
          * `created_at` - created_at
          * `-created_at` - -created_at
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
        description: Izoh bo'yicha qidirish
      - in: query
        name: type
        schema:
          enum:
          - income
          - expense
          type: string
          minLength: 1
        description: |-
          * `income` - Kirim
          * `expense` - Chiqim
      - in: query
        name: wallet
        schema:
          type: integer
      tags:
      - Tranzaksiyalar
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
    post:
      operationId: transactions_create
      description: Turi (kirim/chiqim) tanlangan **kategoriya** turidan olinadi. Hamyon
        balansi avtomatik o'zgaradi; chiqim balansdan oshsa 400 qaytadi.
      summary: Kirim yoki chiqim qo'shish
      tags:
      - Tranzaksiyalar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/transactions/{id}/:
    get:
      operationId: transactions_retrieve
      summary: Tranzaksiyani ko'rish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Tranzaksiyalar
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    put:
      operationId: transactions_update
      summary: Tranzaksiyani to'liq yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Tranzaksiyalar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    patch:
      operationId: transactions_partial_update
      summary: Tranzaksiyani qisman yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Tranzaksiyalar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    delete:
      operationId: transactions_destroy
      description: Hamyon balansi avtomatik qaytariladi.
      summary: Tranzaksiyani o'chirish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Tranzaksiyalar
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/wallets/:
    get:
      operationId: wallets_list
      summary: Hamyonlar ro'yxati
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Hamyonlar
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWalletList'
          description: ''
    post:
      operationId: wallets_create
      summary: Hamyon yaratish
      tags:
      - Hamyonlar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WalletRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WalletRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/wallets/{id}/:
    get:
      operationId: wallets_retrieve
      summary: Hamyonni ko'rish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Hamyonlar
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
    put:
      operationId: wallets_update
      summary: Hamyonni to'liq yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Hamyonlar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WalletRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WalletRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
    patch:
      operationId: wallets_partial_update
      summary: Hamyonni qisman yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Hamyonlar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWalletRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWalletRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWalletRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
    delete:
      operationId: wallets_destroy
      description: Hamyon bilan birga uning tranzaksiyalari ham o'chadi.
      summary: Hamyonni o'chirish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Hamyonlar
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - type
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
      required:
      - name
      - type
    CategoryTotal:
      type: object
      properties:
        category:
          type: integer
        name:
          type: string
        type:
          $ref: '#/components/schemas/TypeEnum'
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        count:
          type: integer
      required:
      - category
      - count
      - name
      - total
      - type
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - old_password
    CurrencyEnum:
      enum:
      - UZS
      - USD
      - EUR
      type: string
      description: |-
        * `UZS` - So'm
        * `USD` - Dollar
        * `EUR` - Yevro
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    PaginatedWalletList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'
    PatchedCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
    PatchedProfileRequest:
      type: object
      properties:
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    PatchedTransactionRequest:
      type: object
      properties:
        wallet:
          type: integer
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 255
        date:
          type: string
          format: date
          description: Berilmasa bugungi sana olinadi.
    PatchedWalletRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Boshlang'ich balans (faqat yaratishda). Keyin balans tranzaksiyalar
            orqali o'zgaradi.
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - id
      - username
    ProfileRequest:
      type: object
      properties:
        email:
