$kind: http-request
description: ""
url: "{{baseUrl}}/api/auth/login/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "password": "string",
      "username": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "username": {
          "type": "string",
          "minLength": 1
        },
        "password": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "password",
        "username"
      ]
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Kirish (token olish).resources/examples
order: 1000
