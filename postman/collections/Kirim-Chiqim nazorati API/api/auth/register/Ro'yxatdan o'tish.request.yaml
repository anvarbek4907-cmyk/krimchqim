$kind: http-request
description: ""
url: "{{baseUrl}}/api/auth/register/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "password": "string",
      "password2": "string",
      "username": "string",
      "email": "string",
      "first_name": "string",
      "last_name": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "username": {
          "type": "string",
          "minLength": 1,
          "maxLength": 150
        },
        "email": {
          "oneOf": [
            {
              "type": "string",
              "format": "email"
            },
            {
              "type": "string"
            }
          ]
        },
        "first_name": {
          "type": "string",
          "maxLength": 150
        },
        "last_name": {
          "type": "string",
          "maxLength": 150
        },
        "password": {
          "type": "string",
          "minLength": 1
        },
        "password2": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "password",
        "password2",
        "username"
      ]
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Ro'yxatdan o'tish.resources/examples
order: 1000
