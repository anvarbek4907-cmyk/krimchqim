$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/refresh/"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "refresh": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access": "string",
        "refresh": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "refresh": {
            "type": "string"
          }
        },
        "required": [
          "access",
          "refresh"
        ]
      }
order: 1000
