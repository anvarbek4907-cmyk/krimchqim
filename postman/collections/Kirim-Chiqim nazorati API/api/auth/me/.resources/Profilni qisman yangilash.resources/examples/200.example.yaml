$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/me/"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "email": "string",
        "first_name": "string",
        "last_name": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1506,
        "username": "string",
        "email": "string",
        "first_name": "string",
        "last_name": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "email": {
            "oneOf": [
              {
                "type": "string",
                "format": "email"
              },
              {
                "type": "string"
              }
            ]
          },
          "first_name": {
            "type": "string",
            "maxLength": 150
          },
          "last_name": {
            "type": "string",
            "maxLength": 150
          }
        },
        "required": [
          "id",
          "username"
        ]
      }
order: 1000
