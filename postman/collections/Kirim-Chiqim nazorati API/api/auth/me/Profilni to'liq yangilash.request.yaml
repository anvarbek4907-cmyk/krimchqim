$kind: http-request
description: ""
url: "{{baseUrl}}/api/auth/me/"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "string",
      "first_name": "string",
      "last_name": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "email": {
          "oneOf": [
            {
              "type": "string",
              "format": "email"
            },
            {
              "type": "string"
            }
          ]
        },
        "first_name": {
          "type": "string",
          "maxLength": 150
        },
        "last_name": {
          "type": "string",
          "maxLength": 150
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Profilni to'liq yangilash.resources/examples
order: 2000
