$kind: http-request
description: ""
url: "{{baseUrl}}/api/wallets/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "4398"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "name": "string",
      "currency": "EUR",
      "balance": "-54978712"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 100
        },
        "currency": {
          "type": "string",
          "enum": [
            "UZS",
            "USD",
            "EUR"
          ],
          "description": "* `UZS` - So'm\n* `USD` - Dollar\n* `EUR` - Yevro"
        },
        "balance": {
          "type": "string",
          "pattern": "^-?\\d{0,12}(?:\\.\\d{0,2})?$",
          "description": "Boshlang'ich balans (faqat yaratishda). Keyin balans tranzaksiyalar orqali o'zgaradi."
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Hamyonni qisman yangilash.resources/examples
order: 3000
