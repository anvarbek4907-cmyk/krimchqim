$kind: http-request
description: Turi (kirim/chiqim) tanlangan **kategoriya** turidan olinadi. Hamyon balansi avtomatik o'zgaradi; chiqim balansdan oshsa 400 qaytadi.
url: "{{baseUrl}}/api/transactions/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "amount": "-918",
      "category": 8529,
      "wallet": 7379,
      "description": "string",
      "date": "2019-09-19"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "wallet": {
          "type": "integer"
        },
        "category": {
          "type": "integer"
        },
        "amount": {
          "type": "string",
          "pattern": "^-?\\d{0,12}(?:\\.\\d{0,2})?$"
        },
        "description": {
          "type": "string",
          "maxLength": 255
        },
        "date": {
          "type": "string",
          "description": "Berilmasa bugungi sana olinadi.",
          "format": "date"
        }
      },
      "required": [
        "amount",
        "category",
        "wallet"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Kirim yoki chiqim qo'shish.resources/examples
order: 2000
