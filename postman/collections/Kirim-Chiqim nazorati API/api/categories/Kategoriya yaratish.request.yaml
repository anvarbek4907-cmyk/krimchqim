$kind: http-request
description: ""
url: "{{baseUrl}}/api/categories/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "string",
      "type": "income"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 100
        },
        "type": {
          "type": "string",
          "enum": [
            "income",
            "expense"
          ],
          "description": "* `income` - Kirim\n* `expense` - Chiqim"
        }
      },
      "required": [
        "name",
        "type"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Kategoriya yaratish.resources/examples
order: 2000
