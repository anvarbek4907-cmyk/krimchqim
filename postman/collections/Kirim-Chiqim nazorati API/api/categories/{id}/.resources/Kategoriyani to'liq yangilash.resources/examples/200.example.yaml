    type: json
    content: |-
      {
        "created_at": "1969-04-22T23:14:09.869Z",
        "id": 3513,
        "name": "string",
        "type": "expense"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 100
          },
          "type": {
            "type": "string",
