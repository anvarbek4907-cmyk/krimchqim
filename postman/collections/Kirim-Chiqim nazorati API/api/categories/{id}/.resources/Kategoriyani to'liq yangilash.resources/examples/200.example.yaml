  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "4398"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "type": "income"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
