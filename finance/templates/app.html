<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirim-Chiqim</title>
<style>
:root{--bg:#f3f4f1;--card:#fff;--ink:#17212b;--mute:#6b7682;--line:#e2e5e0;--in:#16845a;--out:#d14336;--acc:#17212b;--accfg:#fff;--soft:#eef0ec}
@media(prefers-color-scheme:dark){:root{--bg:#0f1418;--card:#171e24;--ink:#e8ecef;--mute:#8d99a5;--line:#27313a;--in:#3dcf94;--out:#ff7a6b;--acc:#e8ecef;--accfg:#0f1418;--soft:#1e272f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--in);margin-right:8px;box-shadow:12px 0 0 var(--out);margin-right:22px}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{opacity:.88}
.sm{padding:6px 12px;font-size:13px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
/* auth */
.auth{max-width:380px;margin:9vh auto;padding:0 18px}
.auth h1{font-size:28px;letter-spacing:-.03em;margin:0 0 4px}
.auth p{color:var(--mute);margin:0 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:3px}
.seg button,.seg label{flex:1;text-align:center;border:0;background:none;border-radius:7px;padding:7px;cursor:pointer;margin:0;font-size:14px;color:var(--mute);font-weight:600}
.seg .on,.seg label:has(input:checked){background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input{display:none}
.err{color:var(--out);font-size:13px;min-height:18px;margin-top:10px}
/* hero */
.hero{padding:26px 0 8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filters>div{flex:1;min-width:130px}
.filters label{margin:0 0 3px}
.balance{font-size:clamp(40px,8vw,68px);font-weight:700;line-height:1.05}
.cap{color:var(--mute);font-size:14px}
.flow{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--soft);margin:16px 0 12px}
.flow b{display:block;height:100%;transition:width .4s}
.flow .i{background:var(--in)}.flow .o{background:var(--out)}
.pair{display:flex;gap:36px;flex-wrap:wrap}
.pair strong{font-size:22px;display:block}
.in{color:var(--in)}.out{color:var(--out)}
/* body */
.cols{display:grid;grid-template-columns:1fr 300px;gap:18px;margin:22px 0 60px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.tabs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tabs .seg{min-width:280px}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools select{width:auto}.tools input{flex:1}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:700;text-align:right;white-space:nowrap}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--out);background:var(--soft)}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
.side h3{margin:0 0 14px;font-size:15px}
.bar{margin-bottom:14px}
.bar div:first-child{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar span{display:block;height:6px;border-radius:4px;background:var(--soft)}
.bar span i{display:block;height:100%;border-radius:4px;background:var(--out)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:22px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(10,14,18,.55)}
dialog h2{margin:0 0 4px;font-size:19px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--acc);color:var(--accfg);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="auth" class="auth" hidden>
  <h1>Kirim-Chiqim</h1>
  <p>Pulingiz qayerga ketayotganini bir joyda ko'ring.</p>
  <div class="panel">
    <div class="seg" id="authTabs"><button class="on" data-m="login">Kirish</button><button data-m="register">Ro'yxatdan o'tish</button></div>
    <form id="authForm">
      <label>Username</label><input name="username" required autocomplete="username">
      <div id="regOnly" hidden><label>Email (ixtiyoriy)</label><input name="email" type="email"></div>
      <label>Parol</label><input name="password" type="password" required autocomplete="current-password">
      <div id="reg2" hidden><label>Parolni takrorlang</label><input name="password2" type="password"></div>
      <div class="err" id="authErr"></div>
      <button class="btn" style="width:100%;margin-top:6px" id="authBtn">Kirish</button>
    </form>
  </div>
</section>

<div id="app" hidden>
<header><div class="wrap">
  <div class="brand"><i></i>Kirim-Chiqim</div>
  <div><span class="cap" id="who"></span> &nbsp;<button class="btn ghost sm" id="logout">Chiqish</button></div>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="filters">
      <div><label for="df">Dan</label><input type="date" id="df"></div>
      <div><label for="dt">Gacha</label><input type="date" id="dt"></div>
      <div><label for="fw">Hamyon</label><select id="fw"></select></div>
    </div>
    <div class="cap">Tanlangan davr balansi</div>
    <div class="balance num" id="bal">0</div>
    <div class="flow"><b class="i" id="fi" style="width:50%"></b><b class="o" id="fo" style="width:50%"></b></div>
    <div class="pair">
      <div><span class="cap">Kirim</span><strong class="in num" id="inc">0</strong></div>
      <div><span class="cap">Chiqim</span><strong class="out num" id="exp">0</strong></div>
      <div><span class="cap">Tranzaksiyalar</span><strong class="num" id="cnt">0</strong></div>
    </div>
  </section>

  <div class="cols">
    <section>
      <div class="tabs">
        <div class="seg" id="tabs"><button class="on" data-t="tx">Tranzaksiyalar</button><button data-t="wallets">Hamyonlar</button><button data-t="cats">Kategoriyalar</button></div>
        <button class="btn" id="add">+ Tranzaksiya</button>
      </div>
      <div class="tools" id="tools">
        <select id="ft"><option value="">Hammasi</option><option value="income">Kirim</option><option value="expense">Chiqim</option></select>
        <input id="fs" placeholder="Izoh bo'yicha qidirish">
      </div>
      <div class="list" id="list"></div>
    </section>
    <aside class="panel side">
      <h3>Chiqimlar kategoriya bo'yicha</h3>
      <div id="breakdown"></div>
    </aside>
  </div>
</main>
</div>

<dialog id="dlg"><form id="f"></form></dialog>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2}).format(Number(n) || 0);
const flat = d => typeof d === 'string' ? d : Array.isArray(d) ? d.map(flat).join(' ')
  : Object.entries(d).map(([k, v]) => (k === 'detail' || k === 'non_field_errors' ? '' : k + ': ') + flat(v)).join(' | ');
const today = () => new Date().toISOString().slice(0, 10);

let access = localStorage.getItem('access'), refreshTok = localStorage.getItem('refresh');
let wallets = [], cats = [], tab = 'tx', authMode = 'login';

function setSession(d) {
  access = d.access; localStorage.setItem('access', access);
  if (d.refresh) { refreshTok = d.refresh; localStorage.setItem('refresh', refreshTok); }
}
const raw = (path, o) => fetch('/api' + path, {
  method: o.method || 'GET',
  headers: Object.assign({'Content-Type': 'application/json'}, access && !o.anon ? {Authorization: 'Bearer ' + access} : {}),
  body: o.body ? JSON.stringify(o.body) : undefined
});
async function renew() {
  if (!refreshTok) return false;
  const r = await fetch('/api/auth/refresh/', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({refresh: refreshTok})});
  if (!r.ok) return false;
  setSession(await r.json()); return true;
}
async function api(path, o = {}) {
  let r = await raw(path, o);
  if (r.status === 401 && !o.anon && await renew()) r = await raw(path, o);
  if (r.status === 401 && !o.anon) { logout(); throw new Error('Sessiya tugadi, qayta kiring.'); }
  if (r.status === 204) return null;
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(flat(d) || 'Xatolik yuz berdi');
  return d;
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };

/* ---------- auth ---------- */
$('#authTabs').onclick = e => {
  const m = e.target.dataset.m; if (!m) return;
  authMode = m;
  document.querySelectorAll('#authTabs button').forEach(b => b.classList.toggle('on', b === e.target));
  $('#regOnly').hidden = $('#reg2').hidden = m === 'login';
  $('#authBtn').textContent = m === 'login' ? 'Kirish' : 'Ro\'yxatdan o\'tish';
  $('#authErr').textContent = '';
};
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  if (authMode === 'login') { delete body.email; delete body.password2; }
  try {
    const d = await api(authMode === 'login' ? '/auth/login/' : '/auth/register/', {method: 'POST', body, anon: true});
    setSession(d); localStorage.setItem('who', d.user.username);
    e.target.reset(); start();
  } catch (err) { $('#authErr').textContent = err.message; }
};
function logout() {
  if (access && refreshTok) fetch('/api/auth/logout/', {method: 'POST',
    headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + access},
    body: JSON.stringify({refresh: refreshTok})}).catch(() => {});
  access = refreshTok = null; localStorage.removeItem('access'); localStorage.removeItem('refresh');
  $('#app').hidden = true; $('#auth').hidden = false;
}
$('#logout').onclick = logout;

/* ---------- data ---------- */
async function start() {
  $('#auth').hidden = true; $('#app').hidden = false;
  $('#who').textContent = localStorage.getItem('who') || '';
  const d = new Date();
  if (!$('#df').value) { $('#df').value = new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString('sv'); $('#dt').value = today(); }
  await guard(loadRefs)();
  await guard(refresh)();
}
async function loadRefs() {
  const [w, c] = await Promise.all([api('/wallets/?page_size=100'), api('/categories/?page_size=100')]);
  wallets = w.results; cats = c.results;
  const cur = $('#fw').value;
  $('#fw').innerHTML = '<option value="">Barcha hamyonlar</option>' + wallets.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  $('#fw').value = cur;
}
function qs(extra = {}) {
  const p = new URLSearchParams();
  if ($('#df').value) p.set('date_from', $('#df').value);
  if ($('#dt').value) p.set('date_to', $('#dt').value);
  if ($('#fw').value) p.set('wallet', $('#fw').value);
  Object.entries(extra).forEach(([k, v]) => v && p.set(k, v));
  return p.toString();
}
async function refresh() {
  const [s, t] = await Promise.all([
    api('/summary/?' + qs()),
    tab === 'tx' ? api('/transactions/?page_size=100&' + qs({type: $('#ft').value, search: $('#fs').value})) : null
  ]);
  const inc = +s.total_income, exp = +s.total_expense, sum = inc + exp;
  $('#bal').textContent = fmt(s.balance);
  $('#bal').className = 'balance num ' + (+s.balance < 0 ? 'out' : '');
  $('#inc').textContent = fmt(inc); $('#exp').textContent = fmt(exp); $('#cnt').textContent = s.transactions_count;
  $('#fi').style.width = (sum ? inc / sum * 100 : 50) + '%';
  $('#fo').style.width = (sum ? exp / sum * 100 : 50) + '%';
  const ex = s.categories.filter(c => c.type === 'expense');
  const max = Math.max(1, ...ex.map(c => +c.total));
  $('#breakdown').innerHTML = ex.length ? ex.map(c => `<div class="bar"><div><em style="font-style:normal">${esc(c.name)}</em><b class="num">${fmt(c.total)}</b></div><span><i style="width:${+c.total / max * 100}%"></i></span></div>`).join('')
    : '<div class="cap">Bu davrda chiqim yo\'q.</div>';
  render(t);
}

/* ---------- lists ---------- */
function render(t) {
  const L = $('#list');
  $('#tools').hidden = tab !== 'tx';
  $('#add').textContent = {tx: '+ Tranzaksiya', wallets: '+ Hamyon', cats: '+ Kategoriya'}[tab];
  if (tab === 'tx') {
    L.innerHTML = t.results.length ? t.results.map(x => {
      const inc = x.type === 'income';
      return `<div class="row"><div class="dot" style="--c:var(${inc ? '--in' : '--out'})">${inc ? '+' : '−'}</div>
        <div class="m"><div class="t">${esc(x.category_name)}</div><div class="s">${esc(x.description || 'Izohsiz')} · ${esc(x.wallet_name)} · ${x.date}</div></div>
        <div class="a num ${inc ? 'in' : 'out'}">${inc ? '+' : '−'}${fmt(x.amount)}</div>
        <button class="x" title="O'chirish" data-del="/transactions/${x.id}/">×</button></div>`;
    }).join('') : '<div class="empty">Bu davrda tranzaksiya yo\'q. Birinchisini qo\'shing.</div>';
  } else if (tab === 'wallets') {
    L.innerHTML = wallets.length ? wallets.map(w => `<div class="row"><div class="dot" style="--c:var(--in)">${esc(w.name[0].toUpperCase())}</div>
      <div class="m"><div class="t">${esc(w.name)}</div><div class="s">${w.currency}</div></div>
      <div class="a num">${fmt(w.balance)}</div><button class="x" title="O'chirish" data-del="/wallets/${w.id}/">×</button></div>`).join('')
      : '<div class="empty">Hamyon yo\'q. Avval hamyon yarating.</div>';
  } else {
    L.innerHTML = cats.length ? cats.map(c => `<div class="row"><div class="dot" style="--c:var(${c.type === 'income' ? '--in' : '--out'})">${c.type === 'income' ? '+' : '−'}</div>
      <div class="m"><div class="t">${esc(c.name)}</div><div class="s">${c.type === 'income' ? 'Kirim' : 'Chiqim'}</div></div>
      <button class="x" title="O'chirish" data-del="/categories/${c.id}/">×</button></div>`).join('')
      : '<div class="empty">Kategoriya yo\'q. Masalan: Oylik, Oziq-ovqat.</div>';
  }
}
$('#list').onclick = guard(async e => {
  const p = e.target.dataset.del; if (!p || !confirm('O\'chirishni tasdiqlaysizmi?')) return;
  await api(p, {method: 'DELETE'}); toast('O\'chirildi');
  await loadRefs(); await refresh();
});
$('#tabs').onclick = guard(async e => {
  if (!e.target.dataset.t) return;
  tab = e.target.dataset.t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === e.target));
  await refresh();
});
['#df', '#dt', '#fw', '#ft'].forEach(s => $(s).onchange = guard(refresh));
$('#fs').oninput = guard(() => { clearTimeout(window.sh); window.sh = setTimeout(guard(refresh), 300); });

/* ---------- forms ---------- */
function openForm(title, html, submit) {
  $('#f').innerHTML = `<h2>${title}</h2>${html}<div class="err" id="ferr"></div>
    <div class="acts"><button type="button" class="btn ghost" id="fc">Bekor qilish</button><button class="btn">Saqlash</button></div>`;
  $('#fc').onclick = () => $('#dlg').close();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    try { await submit(Object.fromEntries(new FormData(e.target))); $('#dlg').close(); await loadRefs(); await refresh(); toast('Saqlandi'); }
    catch (err) { $('#ferr').textContent = err.message; }
  };
  $('#dlg').showModal();
}
const catOpts = type => cats.filter(c => c.type === type).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

$('#add').onclick = () => {
  if (tab === 'wallets') return openForm('Yangi hamyon',
    `<label>Nomi</label><input name="name" required placeholder="Naqd pul">
     <label>Valyuta</label><select name="currency"><option>UZS</option><option>USD</option><option>EUR</option></select>
     <label>Boshlang'ich balans</label><input name="balance" type="number" step="0.01" min="0" placeholder="0">`,
    b => { if (!b.balance) delete b.balance; return api('/wallets/', {method: 'POST', body: b}); });
  if (tab === 'cats') return openForm('Yangi kategoriya',
    `<label>Nomi</label><input name="name" required placeholder="Oziq-ovqat">
     <label>Turi</label><select name="type"><option value="expense">Chiqim</option><option value="income">Kirim</option></select>`,
    b => api('/categories/', {method: 'POST', body: b}));
  if (!wallets.length || !cats.length) return toast('Avval hamyon va kategoriya yarating.');
  openForm('Yangi tranzaksiya',
    `<div class="seg" style="margin-top:10px"><label><input type="radio" name="t" value="expense" checked>Chiqim</label><label><input type="radio" name="t" value="income">Kirim</label></div>
     <label>Kategoriya</label><select name="category" id="fc2" required></select>
     <label>Hamyon</label><select name="wallet">${wallets.map(w => `<option value="${w.id}">${esc(w.name)} (${fmt(w.balance)} ${w.currency})</option>`).join('')}</select>
     <label>Summa</label><input name="amount" type="number" step="0.01" min="0.01" required>
     <label>Sana</label><input name="date" type="date" value="${today()}" max="${today()}">
     <label>Izoh</label><input name="description" maxlength="255">`,
    b => { delete b.t; return api('/transactions/', {method: 'POST', body: b}); });
  const fill = () => { const t = document.querySelector('input[name=t]:checked').value; $('#fc2').innerHTML = catOpts(t) || '<option value="">Bu turda kategoriya yo\'q</option>'; };
  document.querySelectorAll('input[name=t]').forEach(r => r.onchange = fill); fill();
};

access ? start() : ($('#auth').hidden = false);
</script>
</body>
</html>
