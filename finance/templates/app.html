<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5fa584">
<title>Kirim-Chiqim</title>
<style>
:root{--g:#5fa584;--gd:#3f8a68;--bg:#f7f5ee;--ink:#26332d;--mut:#7b8a82;--line:#e4e8e2;--y:#fbbf24;--red:#d8453f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d7e2db;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #2f6fbd;outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}
.top{background:var(--g);color:#fff;padding:10px 16px 0;border-radius:0 0 26px 26px}
.r1{display:flex;align-items:center;justify-content:space-between}
.r1 button{color:#fff;font-size:22px;width:36px;height:36px}
#accSel{background:none;border:0;color:#fff;font-weight:600;text-align:center;appearance:none;padding:4px 8px}
#accSel option{color:#222}
.bal{text-align:center;font-size:22px;font-weight:700;margin:2px 0 8px}
.tabs{display:flex}
.tabs button{flex:1;padding:10px 0;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;border-bottom:3px solid transparent}
.tabs button[aria-pressed=true]{color:#fff;border-color:#fff}
.card{background:#fff;margin:-14px 12px 0;border-radius:18px;padding:12px 12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.08);position:relative}
.per{display:flex;justify-content:space-around;border-bottom:1px solid var(--line)}
.per button{padding:8px 4px;color:var(--mut);font-size:14px;border-bottom:2px solid transparent}
.per button[aria-pressed=true]{color:var(--gd);border-color:var(--gd);font-weight:600}
.nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 2px;position:relative}
.nav button{color:var(--gd);font-size:20px;padding:0 10px}
#lbl{text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-size:14px}
#dp{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.rng{display:flex;gap:8px;margin-top:8px}
.rng input{flex:1;min-width:0}
input,select.f{border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;width:100%;outline-offset:0}
.dw{position:relative;width:230px;height:230px;margin:6px auto 0}
#donut{width:100%;height:100%}
#dt{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:#555;text-align:center;pointer-events:none}
.fab{position:absolute;right:-6px;bottom:2px;width:46px;height:46px;border-radius:50%;background:var(--y);color:#fff;font-size:28px;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.25)}
#items{padding:12px 12px 90px}
.it{background:#fff;border-radius:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;text-align:left}
.row b{flex:1;font-weight:500}
.ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none}
.pc{color:var(--mut);font-size:13px}.am{font-size:14px;min-width:84px;text-align:right}
.ops{border-top:1px dashed var(--line);padding:4px 12px 8px}
.op{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.op .cm{flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{color:var(--red);font-size:20px;padding:0 6px}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.scr{min-height:100vh}
.bar{background:var(--g);color:#fff;padding:12px 14px 0;border-radius:0 0 26px 26px}
.bar h2{margin:0 0 6px 36px;font-size:16px;font-weight:500;position:relative;top:-28px;height:0}
.bar .back{color:#fff;font-size:24px;width:36px;height:36px}
.pad{padding:14px 18px}
.lab{font-size:12px;color:var(--gd);margin:14px 0 4px}
.amt{display:flex;justify-content:center;align-items:baseline;gap:8px;font-size:30px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.amt small{font-size:15px;color:var(--gd)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;text-align:center}
.grid button{font-size:11px;color:#444;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px;border-radius:12px}
.grid .ic{width:44px;height:44px;font-size:21px;border:3px solid transparent}
.grid .sel .ic,.grid button.sel:not(:has(.ic)){outline:3px solid var(--gd);outline-offset:2px}
.chips{display:flex;gap:6px}
.chips button{padding:6px 10px;border-radius:6px;font-size:12px;color:var(--mut);line-height:1.2}
.chips button.sel{background:var(--gd);color:#fff}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-top:10px}
.keys button{background:#fff;padding:13px 0;font-size:20px}
.keys .ok{grid-column:span 3;background:#2f7bd6;color:#fff}
.btn{background:var(--y);color:#fff;font-weight:700;padding:12px 22px;border-radius:24px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.btn.w{width:100%;margin-top:18px}
.ghost{padding:10px 16px;color:var(--gd)}
.pal button{width:34px;height:34px;border-radius:50%;margin:3px 4px 3px 0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pal button.sel{box-shadow:0 0 0 3px var(--gd)}
.pal button.e{background:#dfe8e2;font-size:20px}
.ig button{width:52px;height:52px;border-radius:50%;background:#dfe8e2;font-size:24px;margin:4px}
.ig button.sel{background:var(--gd)}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--ink)}
.sw input{width:44px;height:24px;accent-color:var(--gd)}
#drawer{position:absolute;inset:0;z-index:10;display:flex}
#drawer>div{width:78%;background:#fff;padding:18px;overflow:auto}
#drawer>i{flex:1;background:rgba(0,0,0,.4)}
#drawer h4{margin:18px 0 6px;color:var(--gd);font-size:12px;text-transform:uppercase}
.dr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.lg button{padding:6px 12px;border-radius:14px;margin-right:6px;background:#eef2ee}
.lg button[aria-pressed=true]{background:var(--gd);color:#fff}
.link{color:var(--gd);padding:10px 0;display:block;text-align:left;width:100%}
dialog{border:0;border-radius:16px;padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 8px}
.drow{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
#auth{background:var(--g);display:flex;flex-direction:column;justify-content:center;padding:28px}
#auth h1{color:#fff;margin:0 0 4px;font-size:28px}
#auth form{background:#fff;border-radius:18px;padding:20px;margin-top:18px}
#auth .tabs button{color:var(--mut)}
#auth .tabs button[aria-pressed=true]{color:var(--gd);border-color:var(--gd)}
.err{color:var(--red);min-height:20px;font-size:13px;margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#26332d;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;font-size:14px}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">

<section id="auth" class="scr" hidden>
  <h1>Kirim-Chiqim</h1>
  <div class="lg" id="lgA"></div>
  <form id="af" autocomplete="on">
    <nav class="tabs" id="at"><button type="button" data-m="login" aria-pressed="true" data-i="login"></button><button type="button" data-m="register" aria-pressed="false" data-i="register"></button></nav>
    <div data-reg hidden>
      <label class="lab" data-i="firstName"></label><input name="first_name" autocomplete="given-name" maxlength="150" required disabled>
      <label class="lab" data-i="lastName"></label><input name="last_name" autocomplete="family-name" maxlength="150" required disabled>
      <label class="lab" data-i="email"></label><input name="email" type="email" autocomplete="email" maxlength="254" required disabled>
      <label class="lab" data-i="phone"></label><input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+998 90 123 45 67" required disabled>
    </div>
    <label class="lab" data-i="username"></label><input name="username" autocomplete="username" required>
    <label class="lab" data-i="password"></label><input name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="ae"></p>
    <button class="btn w" id="ab"></button>
  </form>
</section>

<section id="main" class="scr" hidden>
  <header class="top">
    <div class="r1"><button id="menu" aria-label="Menu">☰</button><select id="accSel" aria-label="Account"></select><span style="width:36px"></span></div>
    <div class="bal" id="bal"></div>
    <nav class="tabs" id="tt"><button data-t="expense" data-i="expenses"></button><button data-t="income" data-i="incomes"></button></nav>
  </header>
  <div class="card">
    <nav class="per" id="pt"><button data-p="day" data-i="day"></button><button data-p="week" data-i="week"></button><button data-p="month" data-i="month"></button><button data-p="year" data-i="year"></button><button data-p="period" data-i="period"></button></nav>
    <div class="nav" id="nv"><button id="prev" aria-label="‹">‹</button><button id="lbl"></button><button id="next" aria-label="›">›</button><input type="date" id="dp" tabindex="-1" aria-hidden="true"></div>
    <div class="rng" id="rng" hidden><input type="date" id="rf" aria-label="From"><input type="date" id="rt" aria-label="To"></div>
    <div class="dw"><svg id="donut" viewBox="0 0 42 42"></svg><div id="dt"></div><button class="fab" id="fab" aria-label="+">+</button></div>
  </div>
  <div id="items"></div>
</section>

<section id="add" class="scr" hidden>
  <div class="bar">
    <button class="back" id="ab1" aria-label="Back">←</button><h2 data-i="addOp"></h2>
    <nav class="tabs" id="at2"><button data-t="expense" data-i="expenses"></button><button data-t="income" data-i="incomes"></button></nav>
  </div>
  <div class="pad">
    <div class="amt"><span id="amt">0</span><small id="acur"></small></div>
    <div class="lab" data-i="account"></div><select class="f" id="asel"></select>
    <div class="lab" data-i="category"></div><div class="grid" id="cg"></div>
    <div class="chips" id="dc" style="margin-top:14px"></div>
    <div class="lab" data-i="comment"></div><input id="cmt" maxlength="255">
  </div>
  <div class="keys" id="keys"></div>
</section>

<section id="acc" class="scr" hidden>
  <div class="bar"><button class="back" id="ab2" aria-label="Back">←</button><h2 data-i="addAcc"></h2><div style="height:14px"></div></div>
  <div class="pad">
    <div class="lab" data-i="startBal"></div><input id="nb" type="number" min="0" step="0.01" value="0" inputmode="decimal">
    <div class="lab" data-i="accName"></div><input id="nn" maxlength="100">
    <div class="lab" data-i="icons"></div><div class="ig" id="ni"></div>
    <div class="lab" data-i="color"></div><div class="pal" id="nc"></div>
    <div class="lab" data-i="currency"></div><select class="f" id="ncur"><option>UZS</option><option>USD</option><option>EUR</option></select>
    <label class="sw"><span data-i="excl"></span><input type="checkbox" id="nx"></label>
    <p class="err" id="ne"></p>
    <button class="btn w" id="nsave" data-i="add"></button>
  </div>
</section>

<div id="drawer" hidden><div id="dbody"></div><i id="dx"></i></div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---- 3 tilda matnlar: [kalit, uz, ru, en] ---- */
const ROWS=[
['total','Jami','Итого','Total'],['expenses','Chiqimlar','Расходы','Expenses'],['incomes','Kirimlar','Доходы','Income'],
['day','Kun','День','Day'],['week','Hafta','Неделя','Week'],['month','Oy','Месяц','Month'],['year','Yil','Год','Year'],['period','Davr','Период','Period'],
['today','Bugun','Сегодня','Today'],['yesterday','Kecha','Вчера','Yesterday'],['before','O\'tgan kuni','Позавчера','Day before'],
['addOp','Operatsiya qo\'shish','Добавление операции','Add operation'],['addAcc','Hisob qo\'shish','Добавление счёта','Add account'],
['account','Hisob','Счёт','Account'],['category','Kategoriya','Категория','Category'],['comment','Izoh','Комментарий','Comment'],
['accName','Hisob nomi','Имя счёта','Account name'],['icons','Ikonkalar','Иконки','Icons'],['color','Rang','Цвет','Color'],
['currency','Valyuta','Валюта','Currency'],['excl','Umumiy balansga kiritilmasin','Не учитывать в общем балансе','Exclude from total'],
['add','Qo\'shish','Добавить','Add'],['accounts','Hisoblar','Счета','Accounts'],['newCat','Yangi kategoriya','Новая категория','New category'],
['lang','Til','Язык','Language'],['logout','Chiqish','Выйти','Log out'],['login','Kirish','Войти','Log in'],
['register','Ro\'yxatdan o\'tish','Регистрация','Sign up'],['username','Login','Логин','Username'],['password','Parol','Пароль','Password'],
['empty','Bu davrda yozuv yo\'q','Нет операций за период','No operations for this period'],['ok','Saqlandi','Сохранено','Saved'],
['cancel','Bekor qilish','Отмена','Cancel'],['confirmDel','O\'chirilsinmi?','Удалить операцию?','Delete this operation?'],
['name','Nomi','Название','Name'],['startBal','Boshlang\'ich balans','Начальный баланс','Starting balance'],['more','Yana','Еще','More'],
['transport','Yo\'lkira','Транспорт','Transport'],['cafe','Tushlik','Кафе','Cafe'],['food','Mahsulotlar','Продукты','Groceries'],
['health','Salomatlik','Здоровье','Health'],['leisure','Dam olish','Досуг','Leisure'],['home','Uy','Дом','Home'],
['education','Ta\'lim','Образование','Education'],['salary','Oylik','Зарплата','Salary'],['advance','Avans','Аванс','Advance'],
['daily','Kunlik ish haqi','Дневной заработок','Daily wage'],['gift','Sovg\'a','Подарок','Gift'],['other','Boshqa','Другое','Other'],
['err_bad_credentials','Login yoki parol xato','Неверный логин или пароль','Wrong username or password'],
['err_exists','Bu login band','Такой логин занят','Username is taken'],
['err_short_password','Parol kamida 6 belgi','Пароль минимум 6 символов','Password needs 6+ characters'],
['err_username_required','Login kiriting','Введите логин','Enter a username'],
['err_amount','Summani to\'g\'ri kiriting','Введите сумму','Enter a valid amount'],
['err_no_funds','Hisobda mablag\' yetarli emas','Недостаточно средств','Insufficient funds'],
['err_category','Kategoriyani tanlang','Выберите категорию','Pick a category'],['err_account','Hisobni tanlang','Выберите счёт','Pick an account'],
['firstName','Ism','Имя','First name'],['lastName','Familiya','Фамилия','Last name'],['email','Email','Email','Email'],['phone','Telefon raqam','Номер телефона','Phone number'],
['err_first_name_required','Ismingizni kiriting','Введите имя','Enter your first name'],['err_last_name_required','Familiyangizni kiriting','Введите фамилию','Enter your last name'],
['err_email_invalid','Email noto\'g\'ri','Неверный email','Invalid email'],['err_email_exists','Bu email ro\'yxatdan o\'tgan','Этот email уже зарегистрирован','Email already registered'],
['err_phone_invalid','Telefon raqam noto\'g\'ri (+998...)','Неверный номер телефона','Invalid phone number'],['err_phone_exists','Bu raqam ro\'yxatdan o\'tgan','Этот номер уже зарегистрирован','Phone already registered'],
['err_name_taken','Bu nom band','Такое имя уже есть','Name already used'],['err_name_required','Nomini kiriting','Введите название','Enter a name']
];
const T={uz:{},ru:{},en:{}};
ROWS.forEach(r=>{T.uz[r[0]]=r[1];T.ru[r[0]]=r[2];T.en[r[0]]=r[3]});
let L=localStorage.getItem('lang')||'uz';if(!T[L])L='uz';
const t=k=>T[L][k]??k;
const cn=c=>c.key?t(c.key):c.name;
const fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const loc=()=>({uz:'uz-UZ',ru:'ru-RU',en:'en-GB'}[L]);
const dm=d=>d.toLocaleDateString(loc(),{day:'numeric',month:'long'});
const EMO=['💵','🏦','💳','💰','🪙','📈','👛','🏧','🐷','🏠','🚗','🎁'],CEMO=['🍔','🛒','🚕','🏠','💊','🎓','🎮','👕','📱','✈️','🐶','💼'];
const COL=['#e8433f','#2f6fbd','#5aa94f','#f2c230','#d94f94','#7aa05f','#6bb6e6'];
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}

/* ---- server bilan aloqa ---- */
const csrf=()=>(document.cookie.split('; ').find(c=>c.startsWith('csrftoken='))||'').split('=')[1]||'';
async function call(url,opt){
  const r=await fetch('/web/'+url,opt);const d=await r.json().catch(()=>({}));
  if(r.status===401){show('auth');throw new Error('auth')}
  if(!r.ok)throw new Error(T[L]['err_'+d.error]||d.error||'Error');
  return d;
}
const get=u=>call(u);
const post=(u,b)=>call(u,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(b||{})});
const fail=e=>{if(e.message!=='auth')toast(e.message)};

/* ---- holat ---- */
const P={type:'expense',per:'day',ref:new Date(),acc:'',from:new Date(),to:new Date()};
let S={accounts:[],categories:[],user:''},D=null,openCat=null;
function show(id){['auth','main','add','acc'].forEach(x=>$('#'+x).hidden=x!==id);window.scrollTo(0,0)}
function range(){
  const r=P.ref,y=r.getFullYear(),m=r.getMonth();
  if(P.per==='day')return[r,r];
  if(P.per==='week'){const s=addD(r,-((r.getDay()+6)%7));return[s,addD(s,6)]}
  if(P.per==='month')return[new Date(y,m,1),new Date(y,m+1,0)];
  if(P.per==='year')return[new Date(y,0,1),new Date(y,11,31)];
  return[P.from,P.to];
}
function label(){
  const[a,b]=range();
  if(P.per==='day')return(iso(a)===iso(new Date())?t('today')+', ':'')+dm(a);
  if(P.per==='month')return a.toLocaleDateString(loc(),{month:'long',year:'numeric'});
  if(P.per==='year')return String(a.getFullYear());
  if(P.per==='week')return dm(a)+' – '+dm(b);
  return '';
}
function shift(n){
  const r=new Date(P.ref);
  if(P.per==='day')r.setDate(r.getDate()+n);
  if(P.per==='week')r.setDate(r.getDate()+7*n);
  if(P.per==='month')r.setMonth(r.getMonth()+n,1);
  if(P.per==='year')r.setFullYear(r.getFullYear()+n);
  P.ref=r;load();
}
async function loadState(){
  const d=await get('state/');S=d;
  $('#accSel').innerHTML=`<option value="">${esc(t('total'))}</option>`+S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
  $('#accSel').value=P.acc;
}
async function load(){
  const[a,b]=range(),q=new URLSearchParams({type:P.type,from:iso(a),to:iso(b)});
  if(P.acc)q.set('account',P.acc);
  try{D=await get('stats/?'+q);render()}catch(e){fail(e)}
}
function render(){
  if(!D)return;
  $('#bal').textContent=fmt(D.balance)+' '+D.currency;
  $$('#tt button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===P.type));
  $$('#pt button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===P.per));
  const custom=P.per==='period';
  $('#rng').hidden=!custom;$('#prev').hidden=$('#next').hidden=$('#lbl').hidden=custom;
  $('#lbl').textContent=label();
  const tot=Number(D.total);let off=25,s='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#e8ece9" stroke-width="5"/>';
  D.items.forEach(i=>{const p=tot?Number(i.total)/tot*100:0;s+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${i.color}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p});
  $('#donut').innerHTML=s;
  $('#dt').textContent=fmt(D.total)+' '+D.currency;
  $('#items').innerHTML=D.items.length?D.items.map(i=>`<div class="it"><button class="row" data-open="${i.id}"><span class="ic" style="background:${i.color}">${i.icon}</span><b>${esc(cn(i))}</b><span class="pc">${i.percent}%</span><span class="am">${fmt(i.total)} ${D.currency}</span></button>${openCat==i.id?'<div class="ops">'+i.ops.map(o=>`<div class="op"><span>${o.date.slice(8)}.${o.date.slice(5,7)}</span><span class="cm">${esc(o.comment)}</span><b>${fmt(o.amount)}</b><button class="x" data-del="${o.id}" aria-label="×">×</button></div>`).join('')+'</div>':''}</div>`).join(''):`<p class="empty">${t('empty')}</p>`;
}
$('#items').onclick=async e=>{
  const o=e.target.closest('[data-open]'),d=e.target.closest('[data-del]');
  if(o){openCat=openCat==o.dataset.open?null:o.dataset.open;render()}
  if(d&&confirm(t('confirmDel'))){try{await post('operation/delete/',{id:d.dataset.del});await Promise.all([loadState(),load()])}catch(er){fail(er)}}
};
$('#tt').onclick=e=>{const b=e.target.closest('button');if(b){P.type=b.dataset.t;openCat=null;load()}};
$('#pt').onclick=e=>{const b=e.target.closest('button');if(b){P.per=b.dataset.p;if(P.per!=='period')P.ref=new Date();openCat=null;if(P.per==='period'){$('#rf').value=iso(P.from);$('#rt').value=iso(P.to)}load()}};
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#lbl').onclick=()=>{$('#dp').value=iso(P.ref);$('#dp').showPicker?.()};
$('#dp').onchange=e=>{if(e.target.value){P.ref=new Date(e.target.value+'T00:00');load()}};
$('#rf').onchange=e=>{if(e.target.value){P.from=new Date(e.target.value+'T00:00');load()}};
$('#rt').onchange=e=>{if(e.target.value){P.to=new Date(e.target.value+'T00:00');load()}};
$('#accSel').onchange=e=>{P.acc=e.target.value;load()};

/* ---- operatsiya qo'shish ---- */
const A={type:'expense',amt:'',acc:'',cat:'',d:0};
const showAmt=a=>{const[i,f]=a.split('.');return(i?Number(i).toLocaleString('ru-RU'):'0')+(f!==undefined?','+f:'')};
function openAdd(){
  if(!S.accounts.length)return;
  Object.assign(A,{type:P.type,amt:'',cat:'',d:0,acc:P.acc||S.accounts[0].id});
  $('#cmt').value='';show('add');drawAdd();
}
function drawAdd(){
  $$('#at2 button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===A.type));
  $('#amt').textContent=showAmt(A.amt);
  $('#asel').innerHTML=S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} (${fmt(a.balance)} ${a.currency})</option>`).join('');
  $('#asel').value=A.acc;
  const w=S.accounts.find(a=>a.id==A.acc);$('#acur').textContent=w?w.currency:'';
  $('#cg').innerHTML=S.categories.filter(c=>c.type===A.type).map(c=>`<button data-c="${c.id}" class="${A.cat==c.id?'sel':''}"><span class="ic" style="background:${c.color}">${c.icon}</span>${esc(cn(c))}</button>`).join('')+`<button data-new="1"><span class="ic" style="background:#9bb3a6;color:#fff">+</span>${t('more')}</button>`;
  $('#dc').innerHTML=[0,1,2].map(n=>{const d=addD(new Date(),-n);return`<button data-d="${n}" class="${A.d===n?'sel':''}">${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}<br>${t(['today','yesterday','before'][n])}</button>`}).join('');
}
$('#keys').innerHTML=['1','2','3','⌫','4','5','6','000','7','8','9','.','0','✓'].map(k=>`<button data-k="${k}"${k==='✓'?' class="ok" aria-label="OK"':''}>${k}</button>`).join('');
function key(k){
  if(k==='✓')return submitOp();
  if(k==='⌫')A.amt=A.amt.slice(0,-1);
  else if(k==='.'){if(!A.amt.includes('.'))A.amt=(A.amt||'0')+'.'}
  else if(A.amt.length<12)A.amt+=k;
  A.amt=A.amt.replace(/^0+(?=\d)/,'');$('#amt').textContent=showAmt(A.amt);
}
$('#keys').onclick=e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)};
document.addEventListener('keydown',e=>{
  if($('#add').hidden||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(/^[0-9.]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('✓');
});
$('#cg').onclick=e=>{const c=e.target.closest('[data-c]'),n=e.target.closest('[data-new]');if(c){A.cat=c.dataset.c;drawAdd()}if(n)newCat(A.type)};
$('#dc').onclick=e=>{const b=e.target.closest('[data-d]');if(b){A.d=+b.dataset.d;drawAdd()}};
$('#asel').onchange=e=>{A.acc=e.target.value;drawAdd()};
$('#at2').onclick=e=>{const b=e.target.closest('button');if(b){A.type=b.dataset.t;A.cat='';drawAdd()}};
async function submitOp(){
  if(!A.cat)return toast(t('err_category'));
  try{
    await post('operation/add/',{amount:A.amt,account:A.acc,category:A.cat,date:iso(addD(new Date(),-A.d)),comment:$('#cmt').value});
    P.type=A.type;show('main');await Promise.all([loadState(),load()]);toast(t('ok'));
  }catch(e){fail(e)}
}
$('#fab').onclick=openAdd;$('#ab1').onclick=()=>show('main');$('#ab2').onclick=()=>show('main');

/* ---- ikonka / rang tanlash ---- */
function pick(el,list,cur,cb,icon){
  const draw=()=>{el.innerHTML=list.map(v=>`<button type="button" class="${v===cur?'sel':''}" data-v="${v}"${icon?'':` style="background:${v}"`}>${icon?v:''}</button>`).join('')};
  draw();el.onclick=e=>{const b=e.target.closest('button');if(b){cur=b.dataset.v;cb(cur);draw()}};
}
/* ---- yangi hisob ---- */
const N={icon:EMO[0],color:COL[2]};
function openAcc(){
  $('#nb').value=0;$('#nn').value='';$('#nx').checked=false;$('#ne').textContent='';
  pick($('#ni'),EMO,N.icon,v=>N.icon=v,true);pick($('#nc'),COL,N.color,v=>N.color=v,false);show('acc');
}
$('#nsave').onclick=async()=>{
  try{
    await post('account/add/',{name:$('#nn').value,balance:$('#nb').value,currency:$('#ncur').value,icon:N.icon,color:N.color,exclude:$('#nx').checked});
    await loadState();await load();show('main');toast(t('ok'));
  }catch(e){$('#ne').textContent=e.message}
};
/* ---- yangi kategoriya ---- */
function newCat(type){
  const d=$('#dlg');let ic=CEMO[0],co=COL[1];
  d.innerHTML=`<h3>${t('newCat')} · ${t(type==='income'?'incomes':'expenses')}</h3><input id="cnm" placeholder="${t('name')}" maxlength="40"><div class="ig" id="cgi"></div><div class="pal" id="cgc"></div><p class="err" id="ce"></p><div class="drow"><button class="ghost" id="cx">${t('cancel')}</button><button class="btn" id="cs">${t('add')}</button></div>`;
  pick($('#cgi'),CEMO,ic,v=>ic=v,true);pick($('#cgc'),COL,co,v=>co=v,false);
  $('#cx').onclick=()=>d.close();
  $('#cs').onclick=async()=>{
    try{await post('category/add/',{name:$('#cnm').value,type,icon:ic,color:co});await loadState();d.close();if(!$('#add').hidden)drawAdd()}
    catch(e){$('#ce').textContent=e.message}
  };
  d.showModal();
}
/* ---- yon menyu ---- */
function drawer(){
  $('#dbody').innerHTML=`<b>${esc(S.name||S.user)}</b><div style="color:var(--mut);font-size:13px">${esc(S.email||'')}<br>${esc(S.phone||'')}</div>
  <h4>${t('lang')}</h4><div class="lg">${['uz','ru','en'].map(l=>`<button data-l="${l}" aria-pressed="${l===L}">${l.toUpperCase()}</button>`).join('')}</div>
  <h4>${t('accounts')}</h4>${S.accounts.map(a=>`<div class="dr"><span>${a.icon} ${esc(a.name)}</span><b>${fmt(a.balance)} ${a.currency}</b></div>`).join('')}
  <button class="link" data-a="acc">+ ${t('addAcc')}</button><button class="link" data-a="cat">+ ${t('newCat')}</button>
  <h4></h4><button class="link" data-a="out" style="color:var(--red)">${t('logout')}</button>`;
  $('#drawer').hidden=false;
}
$('#menu').onclick=drawer;$('#dx').onclick=()=>$('#drawer').hidden=true;
$('#dbody').onclick=async e=>{
  const l=e.target.closest('[data-l]'),a=e.target.closest('[data-a]');
  if(l)setLang(l.dataset.l);
  if(a){$('#drawer').hidden=true;
    if(a.dataset.a==='acc')openAcc();
    if(a.dataset.a==='cat')newCat(P.type);
    if(a.dataset.a==='out'){await post('logout/');S={accounts:[],categories:[],user:''};show('auth')}}
};
/* ---- kirish / ro'yxatdan o'tish ---- */
let mode='login';
function setMode(m){mode=m;$$('#at button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===m));$$('[data-reg]').forEach(d=>{d.hidden=m==='login';d.querySelectorAll('input').forEach(i=>i.disabled=m==='login')});$('#ab').textContent=t(m);$('#ae').textContent=''}
$('#at').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};
$('#af').onsubmit=async e=>{
  e.preventDefault();$('#ab').disabled=true;
  try{await post(mode+'/',Object.fromEntries(new FormData(e.target)));e.target.reset();boot()}
  catch(er){$('#ae').textContent=er.message}
  $('#ab').disabled=false;
};
/* ---- til ---- */
function applyLang(){
  document.documentElement.lang=L;
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#ab').textContent=t(mode);
  $('#lgA').innerHTML=['uz','ru','en'].map(l=>`<button data-l="${l}" aria-pressed="${l===L}" style="color:#fff;opacity:${l===L?1:.6};font-weight:600;padding:4px 8px">${l.toUpperCase()}</button>`).join('');
}
function setLang(l){
  L=l;localStorage.setItem('lang',l);applyLang();
  if(S.user){loadState();render();drawer();if(!$('#add').hidden)drawAdd()}
}
$('#lgA').onclick=e=>{const b=e.target.closest('[data-l]');if(b)setLang(b.dataset.l)};
async function boot(){
  try{await loadState();show('main');await load()}catch(e){if(e.message!=='auth')toast(e.message)}
}
applyLang();boot();
</script>
</body>
</html>
