$kind: http-request
description: Parolni almashtiradi. Eski tokenlar bekor qilinadi, yangi token qaytadi.
url: "{{baseUrl}}/api/auth/change-password/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "old_password": "Str0ng-pass-123",
      "new_password": "N3w-Str0ng-pass-456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.collectionVariables.set('access', json.access);
      pm.collectionVariables.set('refresh', json.refresh);
    language: text/javascript
order: 6000
