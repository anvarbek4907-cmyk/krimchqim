$kind: http-request
description: Refresh tokenni bekor qiladi (blacklist). Access token muddati tugaguncha ishlashda davom etishi mumkin.
url: "{{baseUrl}}/api/auth/logout/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refresh": "{{refresh}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 204', function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 7000
